appId: com.drelwick.desktop
productName: Drelwick
artifactName: Drelwick-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
files:
  - dist/main/**/*.js
  - dist/preload/preload.cjs
  - dist/renderer/index.html
  - dist/renderer/assets/**
  - assets/icons/app.ico
  - assets/icons/app.png
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.cts"
  - "!**/*.d.mts"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/fixtures/**"
  - "!**/.history/**"
  - "!**/*.log"
  - "!**/.env*"
  - "!**/.git/**"
  - "!**/coverage/**"
  - "!**/playwright-report/**"
  - "!**/test-results/**"
  # Our workspace packages execute dist; third-party src can be runtime code.
  - "!node_modules/@drelwick/*/src/**"
  - "!node_modules/@drelwick/*/scripts/**"
  - "!node_modules/@drelwick/*/tsconfig*.json"
  - "!node_modules/@drelwick/*/vitest.config.*"
  # Reviewed pinned dependencies execute dist or root JS, never these sources.
  - "!node_modules/@tiptap/*/src/**"
  - "!node_modules/prosemirror-*/src/**"
  - "!node_modules/{entities,sharp,zod}/src/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/fixtures/**"
  - "!node_modules/@img/sharp-*{,/**/*}"
  - "!node_modules/@napi-rs/canvas-*{,/**/*}"
asar: true
beforePack: scripts/include-native-images.cjs
asarUnpack:
  - "node_modules/@img/sharp-*/**"
  - "**/*.node"
  - "**/*.dll"
  - "**/*.so*"
  - "**/*.dylib"
  - "**/ffmpeg.dll"
  - "**/libGLESv2.dll"
  - "**/vk_swiftshader.dll"
extraMetadata:
  main: dist/main/main.js
win:
  icon: assets/icons/app.ico
  signAndEditExecutable: false
  target:
    - portable
    - nsis
mac:
  identity: null
  icon: assets/icons/app.png
  target:
    - dmg
linux:
  executableName: drelwick
  maintainer: Darren Pratt
  icon: assets/icons/app.png
  category: Office
  target:
    - AppImage
    - deb
